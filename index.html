<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tesouraria Turma 125</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      margin: 0;
      padding: 20px;
      color: #333;
    }

    h1 {
      text-align: center;
      color: #2c3e50;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .card {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .highlight {
      background: #4CAF50;
      color: white;
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }

    .pix {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .pix div {
      flex: 1;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #3498db;
      color: white;
    }

    .btn {
      background: #3498db;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn:hover {
      background: #2980b9;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>💰 VALORES ARRECADADOS - TURMA 125 FARMÁCIA</h1>

  <div class="card highlight">
    Valor mensal: R$ <span id="valorMensal">5</span>
  </div>

  <div class="card">
    <h2>💳 Pagamento via Pix</h2>
    <div class="pix">
      <div>
        <p><strong>Chave Pix:</strong> 86981237979</p>
        <p>Envie o comprovante após pagamento.</p>
      </div>
      <div>
        <img src="MEU_PIX.png" width="150">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>👥 Pagamentos Mês de Maio</h2>
    <table id="tabelaPagamentos">
      <tr>
        <th>Nome</th>
        <th>Status</th>
        <th>Ação</th>
      </tr>
    </table>
  </div>

  <div class="card" style="text-align:center;">
    <h2>💰 Total em Caixa</h2>
    <p style="font-size: 40px; font-weight: bold; color: #27ae60;">
      R$ <span id="total">0</span>
    </p>
    <p style="color: #777;">Atualizado automaticamente</p>
  </div>

</div>

<script>
const valorMensal = 5;

const alunos = [
  "ALEXANDRE", "ALANE BEATRIZ", "AMARA VITÓRIA", "ANA CAROLINE", "ANGÊLO GABRIEL", "ANGÊLO VINICIUS", "ARIELLY", "GISELY", "GLÓRIA", "GUSTAVO CASTRO", "GUSTAVO HENRIQUE", "ILAN CASSIO", "JOÃO GABRIEL", "JOÃO HENRIQUE", "JOÃO LUCAS", "JOHN CALEBE", "JULIANA NAYRA", "LUCAS LOHAN", "MARCONE", "MARIA CLARA LIMA", "MARIA CLARA MENDES", "MARIA JOANA", "RANE GEOVANA", "RICHARLYSON", "ROBERTA", "SÁVIO", "STEFANY", "THIAGO", "VANDA", "WENDELL", "YANA"
];

let pagamentos = JSON.parse(localStorage.getItem("pagamentos")) || {};

const tabela = document.getElementById("tabelaPagamentos");
const totalSpan = document.getElementById("total");

// 🔒 verifica se é admin
const params = new URLSearchParams(window.location.search);
const isAdmin = params.get("admin") === "123";

function renderPagamentos() {
  tabela.innerHTML = `
    <tr>
      <th>Nome</th>
      <th>Status</th>
      <th>Ação</th>
    </tr>
  `;

  let total = 0;

  alunos.forEach(nome => {
    const row = document.createElement("tr");

    const nomeTd = document.createElement("td");
    nomeTd.textContent = nome;

    const statusTd = document.createElement("td");

    if (pagamentos[nome]) {
      statusTd.innerHTML = `✅ Pago em: ${pagamentos[nome]}`;
      total += valorMensal;
    } else {
      statusTd.innerHTML = `❌ Não pago`;
    }

    const btnTd = document.createElement("td");

    if (isAdmin) {
      const btn = document.createElement("button");
      btn.textContent = "Marcar";
      btn.className = "btn";

      btn.onclick = () => {
        const hoje = new Date().toLocaleDateString();
        pagamentos[nome] = hoje;
        localStorage.setItem("pagamentos", JSON.stringify(pagamentos));
        renderPagamentos();
      };

      btnTd.appendChild(btn);
    } else {
      btnTd.innerHTML = "🔒";
    }

    row.appendChild(nomeTd);
    row.appendChild(statusTd);
    row.appendChild(btnTd);

    tabela.appendChild(row);
  });

  totalSpan.textContent = total.toFixed(2);
}

renderPagamentos();
</script>

</body>
</html>
